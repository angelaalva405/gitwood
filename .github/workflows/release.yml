name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to build (defaults to the ref selected above)'
        required: false
        default: ''

# Build the macOS DMG, keep it as a workflow artifact, and publish a GitHub
# Release whenever the build targets a tag.
permissions:
  contents: write

# macOS only for now; Windows and Linux packaging are added later.
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - run: pnpm install --frozen-lockfile
      - name: Build universal DMG (ad-hoc, no notarization)
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Rename DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.ref || github.ref_name }}
        run: |
          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TARGET" >/dev/null 2>&1; then
            name="gitwood-$version"
          else
            # Non-tag builds carry the ref and commit so repeated runs never collide.
            label=${TARGET//\//-}
            name="gitwood-$version-$label-$(git rev-parse --short HEAD)"
          fi
          cd target/universal-apple-darwin/release/bundle/dmg
          for dmg in ./*.dmg; do
            mv "$dmg" "$name.dmg"
          done
      - name: SHA-256
        working-directory: target/universal-apple-darwin/release/bundle/dmg
        run: shasum -a 256 ./*.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gitwood-macOS-universal-${{ inputs.ref || github.ref_name }}
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        if: inputs.ref != '' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG is not a tag; keeping the workflow artifact only."
            exit 0
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Gitwood $TAG" \
              --notes "Universal macOS build (arm64 + x86_64), ad-hoc signed and not notarized."
          fi
          gh release upload "$TAG" \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            target/universal-apple-darwin/release/bundle/dmg/SHA256SUMS.txt \
            --clobber
