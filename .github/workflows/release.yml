name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to build (defaults to the ref selected above)'
        required: false
        default: ''

# Upload build artifacts only; public GitHub Releases require maintainer approval.
permissions:
  contents: read

# macOS only for now; Windows and Linux packaging are added later.
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - run: pnpm install --frozen-lockfile
      - name: Build universal DMG (ad-hoc, no notarization)
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: SHA-256
        working-directory: target/universal-apple-darwin/release/bundle/dmg
        run: shasum -a 256 ./*.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gitwood-macOS-universal-${{ inputs.ref || github.ref_name }}
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
          if-no-files-found: error
